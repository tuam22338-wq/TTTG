<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bách Mật Sáng Thế Giả</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Rajdhani:wght@600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #1a1a1a;
        color: #e0e0e0;
      }
      h1, h2, h3, h4, h5, h6, .font-rajdhani {
        font-family: 'Rajdhani', sans-serif;
      }
      .font-title {
        font-family: 'Cinzel Decorative', serif;
      }
      /* Custom Scrollbar Styles */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4a4a4a;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #6a6a6a;
      }
      
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at var(--x) var(--y), rgba(200, 200, 200, 0.03), transparent 40vmax);
        z-index: -1;
        pointer-events: none;
        transition: background 0.2s ease-out;
      }

      /* Neumorphism Base Classes */
      .neumorphic-flat {
        background: #1a1a1a;
        box-shadow: 6px 6px 12px #141414, -6px -6px 12px #202020;
      }
      .neumorphic-inset {
        background: #1a1a1a;
        box-shadow: inset 6px 6px 12px #141414, inset -6px -6px 12px #202020;
      }
      .neumorphic-convex {
        background: linear-gradient(145deg, #1c1c1c, #171717);
        box-shadow: 6px 6px 12px #141414, -6px -6px 12px #202020;
      }
       .neumorphic-concave {
        background: linear-gradient(145deg, #171717, #1c1c1c);
        box-shadow: inset 6px 6px 12px #141414, inset -6px -6px 12px #202020;
      }

      /* Glassmorphism Base Class */
      .glassmorphic {
        background: rgba(40, 40, 40, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.12.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('mousemove', e => {
          document.body.style.setProperty('--x', e.clientX + 'px');
          document.body.style.setProperty('--y', e.clientY + 'px');
      });
    </script>
  </body>
</html>
